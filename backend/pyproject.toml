[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "subgrad-backend"
version = "0.1.0"
description = "subgrad 2.0 Backend — Deterministic Math Engine for AI-Driven Calculus & ML Education"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # Web framework & ASGI server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",

    # Core math engine — Zero-Hallucination Policy enforcement
    "sympy>=1.13.0",
    "numpy>=2.0.0",

    # Data validation & settings management
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Environment variable loading
    "python-dotenv>=1.0.0",

    # Gemini AI — Socratic tutor engine (Phase 2)
    "google-genai>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",   # for TestClient async support
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
